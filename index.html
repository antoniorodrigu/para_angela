<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ángela</title>
  <link rel="stylesheet" href="./src/css/global.css">
  <link rel="stylesheet" href="./src/css/cover.css">
</head>
<body class="cover-page">
  <div class="page-transition-overlay" id="transition-overlay"></div>

  <!-- Warm Ambient Candle Glows -->
  <div class="cover-glow glow-center" aria-hidden="true"></div>
  <div class="cover-glow glow-left" aria-hidden="true"></div>
  <div class="cover-glow glow-right" aria-hidden="true"></div>

  <!-- Decorative Corner Flora (SVG) -->
  <div class="corner-flora top-left" aria-hidden="true">
    <svg viewBox="0 0 100 100" fill="none" width="80" height="80">
      <path d="M10 90 Q30 40 90 10" stroke="#C47F86" stroke-width="2" stroke-linecap="round"/>
      <circle cx="25" cy="65" r="7" fill="#783D4B" opacity="0.85"/>
      <circle cx="45" cy="45" r="9" fill="#DDA8AA" opacity="0.85"/>
      <circle cx="65" cy="25" r="6" fill="#E4CAA1" opacity="0.85"/>
      <path d="M25 65 Q15 50 10 58" stroke="#51352F" stroke-width="1.5"/>
      <path d="M45 45 Q35 30 30 38" stroke="#51352F" stroke-width="1.5"/>
    </svg>
  </div>
  <div class="corner-flora bottom-right" aria-hidden="true">
    <svg viewBox="0 0 100 100" fill="none" width="80" height="80">
      <path d="M90 10 Q70 60 10 90" stroke="#C47F86" stroke-width="2" stroke-linecap="round"/>
      <circle cx="75" cy="35" r="7" fill="#783D4B" opacity="0.85"/>
      <circle cx="55" cy="55" r="9" fill="#DDA8AA" opacity="0.85"/>
      <circle cx="35" cy="75" r="6" fill="#E4CAA1" opacity="0.85"/>
    </svg>
  </div>

  <!-- Ambient Floating Hearts (SVG) -->
  <div class="cover-heart heart-1" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="#783D4B"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
  </div>
  <div class="cover-heart heart-2" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="#E4CAA1"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
  </div>
  <div class="cover-heart heart-3" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="#C47F86"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
  </div>

  <main class="cover-container" id="cover-main">
    <!-- Header with Name -->
    <div class="title-wrap">
      <div class="title-line left" aria-hidden="true"></div>
      <h1 class="cover-title" id="cover-title">Ángela</h1>
      <div class="title-line right" aria-hidden="true"></div>
    </div>

    <!-- Small Pulsing Heart Accent -->
    <div class="center-heart-pulse" id="center-heart" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="#783D4B" width="18" height="18"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>

    <!-- Sequential Phrases -->
    <div class="cover-phrases">
      <p class="phrase phrase-1" id="phrase-1">Hice algo para ti.</p>
      <p class="phrase phrase-2" id="phrase-2">No quería que fuera solamente otro mensaje.</p>
      <p class="phrase phrase-3" id="phrase-3">Quería que fuera algo que pudieras descubrir poco a poco.</p>
    </div>

    <!-- Call to Action Section -->
    <div class="cover-cta" id="cover-cta">
      <p class="phrase-italic">Solo tienes que entrar.</p>
      <button class="btn-enter" id="enter-button" aria-label="Entrar a la experiencia">
        <span>Entrar</span>
      </button>
      <p class="sub-cta">Hay algo esperándote.</p>
    </div>
  </main>

  <script type="module" src="./src/js/cover.js"></script>
</body>
</html>
