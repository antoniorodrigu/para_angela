<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pequeñas cosas que he ido descubriendo</title>
  <link rel="stylesheet" href="./src/css/global.css">
  <link rel="stylesheet" href="./src/css/book.css">
</head>
<body>
  <div class="page-transition-overlay" id="transition-overlay"></div>
  <main class="book-layout">
    <div class="book-container">
      <div id="book" class="book">
        <!-- Pages injected by JS -->
      </div>
    </div>
    
    <div class="book-navigation">
      <button id="btn-prev" class="book-nav-btn" aria-label="Página anterior" disabled>Anterior</button>
      <span id="page-indicator" class="page-indicator">Portada</span>
      <button id="btn-next" class="book-nav-btn" aria-label="Página siguiente">Siguiente</button>
    </div>

    <div class="book-footer">
      <button class="nav-link" id="btn-volver" aria-label="Cerrar el libro">Cerrar el libro</button>
    </div>
  </main>
  <script type="module" src="./src/js/book.js"></script>
</body>
</html>
