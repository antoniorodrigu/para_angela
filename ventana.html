<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventana</title>
  <link rel="stylesheet" href="./src/css/global.css">
  <link rel="stylesheet" href="./src/css/window.css">
</head>
<body>
  <div class="page-transition-overlay" id="transition-overlay"></div>
  <main class="window-container">
    <div class="night-landscape">
      <div class="sky"></div>
      <div class="hill hill-1"></div>
      <div class="hill hill-2"></div>
      <div class="hill hill-3"></div>
      
      <div class="text-layer">
        <p id="text-1" class="window-text">No tengo idea de qué viene después.</p>
        <p id="text-2" class="window-text">Y quizá esa sea una de las partes bonitas de conocerte.</p>
      </div>
    </div>
    
    <div class="window-footer">
      <button class="nav-link" id="btn-volver" aria-label="Volver a la habitación">Volver</button>
    </div>
  </main>
  <script type="module" src="./src/js/window.js"></script>
</body>
</html>
